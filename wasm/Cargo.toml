[package]
name = "flowverse-wasm"
version = "0.1.0"
edition = "2024"
description = "Thin WebAssembly wrapper exposing flowverse-core to JavaScript."

[lib]
# cdylib: the .wasm file the browser loads. rlib: lets `cargo test` link
# the crate natively, so the JSON logic can be tested without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
flowverse-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
